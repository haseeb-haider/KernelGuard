name: Windows Kernel Driver Build

on:
  push:
    branches: [ main, everthing ]
  pull_request:
    branches: [ main, everthing ]

jobs:
  build:
    # windows-latest/windows-2022 don't ship the WDK, and standalone WDK
    # install is deprecated as of Windows Server 2025 — the WDK/SDK now come
    # from the NuGet packages restored below (see packages.config /
    # Directory.Build.props), following Microsoft's own documented pattern
    # for building driver samples on GitHub Actions.
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore WDK/SDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Locate stampinf.exe (diagnostic)
        run: |
          Write-Host "--- in restored NuGet packages ---"
          Get-ChildItem -Path .\packages -Recurse -Filter 'stampinf.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- anywhere under Program Files (x86)\Windows Kits ---"
          Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter 'stampinf.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- anywhere under Program Files\Windows Kits ---"
          Get-ChildItem -Path 'C:\Program Files\Windows Kits' -Recurse -Filter 'stampinf.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Build KernelGuard solution
        run: msbuild src\KernelGuard.sln /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true /m

      - name: Verify .sys output
        run: |
          $outputRoot = 'src\KernelGuard'
          $files = Get-ChildItem -Path $outputRoot -Recurse -Filter '*.sys' -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No .sys files found under $outputRoot"
            exit 1
          }
          Write-Host 'Found .sys file(s):'
          $files | ForEach-Object { Write-Host "  $($_.FullName)" }
