name: Windows Kernel Driver Build

on:
  push:
    branches: [ main, everthing ]
  pull_request:
    branches: [ main, everthing ]

jobs:
  build:
    # windows-latest/windows-2022 don't ship the WDK, and standalone WDK
    # install is deprecated as of Windows Server 2025 — the WDK/SDK now come
    # from the NuGet packages restored below (see packages.config /
    # Directory.Build.props), following Microsoft's own documented pattern
    # for building driver samples on GitHub Actions.
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore WDK/SDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Add WDK tools (stampinf, inf2cat, ...) to PATH
        run: |
          # The WDK NuGet package ships its command-line tools under
          # packages\Microsoft.Windows.WDK.x64.<version>\c\bin\<version>\x64\
          # but doesn't add them to PATH the way a full WDK install would -
          # the Driver build customization (StampInf, Inf2Cat) resolves them
          # via PATH lookup, so without this the build fails with
          # "TRK0005: Failed to locate: stampinf.exe".
          $wdkBin = Get-ChildItem -Path '.\packages\Microsoft.Windows.WDK.x64.*\c\bin\*\x64' -Directory -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Adding to PATH: $wdkBin"
          Add-Content -Path $env:GITHUB_PATH -Value $wdkBin

      - name: Build KernelGuard solution
        # EnableInf2cat is off here because InfVerif/Inf2Cat (catalog
        # generation for driver signing) can't resolve a relative DLL path
        # against the NuGet-restored WDK layout in this CI environment -
        # that's packaging/signing tooling, not something CI needs in order
        # to prove the driver source compiles and links. RunCodeAnalysis is
        # dropped for the same reason: the PREfast plugin DLL fails to load
        # here (ERROR_MOD_NOT_FOUND) even though the file is present -
        # suspected missing runtime dependency in this NuGet-only WDK layout.
        run: msbuild src\KernelGuard.sln /p:Configuration=Release /p:Platform=x64 /p:EnableInf2cat=false /m

      - name: Verify .sys output
        run: |
          $outputRoot = 'src\KernelGuard'
          $files = Get-ChildItem -Path $outputRoot -Recurse -Filter '*.sys' -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No .sys files found under $outputRoot"
            exit 1
          }
          Write-Host 'Found .sys file(s):'
          $files | ForEach-Object { Write-Host "  $($_.FullName)" }
